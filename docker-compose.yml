services:
  nats:
    image: nats:2.14.2-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
      POSTGRES_DB: incidentdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incidentdb"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      ROLE: api
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://incident:incident@postgres:5432/incidentdb?sslmode=disable
      NATS_URL: nats://nats:4222
      NATS_REPLICAS: 1
      PG_MAX_CONNS: 64
      MAX_IN_FLIGHT: 20000
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "8080:8080"

  realtime:
    build: ./backend
    environment:
      ROLE: realtime
      HTTP_ADDR: :8080
      NATS_URL: nats://nats:4222
      NATS_REPLICAS: 1
      CORS_ORIGIN: "*"
      SSE_CLIENT_BUFFER: 1024
    depends_on:
      nats:
        condition: service_started
    ports:
      - "8081:8080"

  worker:
    build: ./backend
    environment:
      ROLE: worker
      DATABASE_URL: postgres://incident:incident@postgres:5432/incidentdb?sslmode=disable
      NATS_URL: nats://nats:4222
      NATS_REPLICAS: 1
      WORKER_BATCH_SIZE: 1000
      WORKER_FETCH_WAIT: 500ms
      PG_MAX_CONNS: 16
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  frontend:
    build: ./frontend
    depends_on:
      - api
      - realtime
    ports:
      - "3000:80"

volumes:
  nats-data:
  postgres-data:
