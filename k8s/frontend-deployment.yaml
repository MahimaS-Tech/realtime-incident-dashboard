apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-frontend
  namespace: incident-dashboard
spec:
  replicas: 2
  selector:
    matchLabels: { app: incident-frontend }
  template:
    metadata:
      labels: { app: incident-frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/YOUR_ORG/incident-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: incident-frontend
  namespace: incident-dashboard
spec:
  selector: { app: incident-frontend }
  ports:
    - port: 80
      targetPort: 80
