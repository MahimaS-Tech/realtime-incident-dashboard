apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-realtime
  namespace: incident-dashboard
spec:
  replicas: 4
  selector:
    matchLabels: { app: incident-realtime }
  template:
    metadata:
      labels: { app: incident-realtime }
    spec:
      containers:
        - name: realtime
          image: ghcr.io/YOUR_ORG/incident-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: incident-config }
          env:
            - name: ROLE
              value: realtime
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: "500m", memory: "256Mi" }
            limits: { cpu: "2", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: realtime
  namespace: incident-dashboard
spec:
  selector: { app: incident-realtime }
  ports:
    - port: 8080
      targetPort: 8080
